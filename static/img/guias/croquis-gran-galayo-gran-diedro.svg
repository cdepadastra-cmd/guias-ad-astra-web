<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-label="Croquis esquemático de Gran Galayo · Gran Diedro"><defs><linearGradient id="ggran-galayo-gran-diedro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d8378"/><stop offset="1" stop-color="#5d554d"/></linearGradient></defs><rect width="900" height="680" rx="18" fill="#1b120c"/><path d="M70 620 L110 420 L150 300 L190 200 L250 130 L300 120 L340 170 L370 300 L410 620Z" fill="url(#ggran-galayo-gran-diedro)" stroke="#a89c8e" stroke-width="2"/><g stroke="#4a433c" stroke-width="2" fill="none" opacity=".6"><path d="M180 600 l20 -120 l-10 -80"/><path d="M330 590 l-14 -150 l10 -60"/></g><path d="M170 600 L190 500" stroke="#4caf50" stroke-width="5" stroke-linecap="round"/><path d="M190 500 L262 230" stroke="#9ccc65" stroke-width="5" stroke-linecap="round"/><path d="M262 230 L292 132" stroke="#7cc47f" stroke-width="5" stroke-linecap="round"/><path d="M170 600" /><text x="170" y="620" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#f3e9df" text-anchor="middle">Inicio</text><circle cx="190" cy="500" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="204" y="504" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R1</text><circle cx="262" cy="230" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="276" y="234" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R2</text><text x="166" y="554" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L1 IV</text><text x="212" y="369" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L2 IV+</text><text x="263" y="185" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L3 III</text><text x="300" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#e9a53b" text-anchor="middle">Cima del Gran Galayo (≈ 2.220 m)</text><path d="M320 140 Q440 140 430 300" stroke="#4fb3e8" stroke-width="3" stroke-dasharray="8 6" fill="none"/><path d="M430 306 l-6 -10 h12z" fill="#4fb3e8"/><text x="24" y="636" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4fb3e8">↘ Bajada sin rápel: destrepe (III) por hitos a la portilla y canal</text><text x="460" y="54" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#f3e9df">Gran Galayo · Gran Diedro</text><text x="460" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#b9a593">≈ 100–120 m · IV+ (pasos de V) · cara sureste</text><rect x="460" y="129" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="146" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="146" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L1 </text><text x="524" y="166" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Resalte vertical y expuesto antes de la</text><text x="524" y="182" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">portilla; terraza inclinada al pie del</text><text x="524" y="198" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">diedro.</text><rect x="460" y="215" width="54" height="24" rx="6" fill="#9ccc65"/><text x="487" y="232" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV+</text><text x="524" y="232" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L2 ≈ 60 m</text><text x="524" y="252" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">El gran diedro: un desplome en la primera</text><text x="524" y="268" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">mitad, final casi en chimenea; clavos.</text><rect x="460" y="285" width="54" height="24" rx="6" fill="#7cc47f"/><text x="487" y="302" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">III</text><text x="524" y="302" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L3 </text><text x="524" y="322" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Hombrito, diedro tumbado y cueva entre</text><text x="524" y="338" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">bloques; salida a la derecha a la cima.</text><text x="24" y="662" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8a7d6e">Croquis esquemático y orientativo de Guías Ad Astra. No sustituye a una reseña actualizada.</text></svg>