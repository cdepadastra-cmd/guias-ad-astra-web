# Solo lectura: lista lo que hay en la carpeta de la web en el servidor (no cambia nada).
name: Servidor - listar carpeta web
on: workflow_dispatch
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
      - name: Listar
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U","$P" "$H" -e "set ssl:verify-certificate no; set net:max-retries 3; echo '== raiz FTP =='; cls -la /; echo '== web =='; cls -la /guiasadastra.com/; echo '== tamano =='; du -s --block-size=1M /guiasadastra.com/ ; bye" 2>&1 | sed 's/^/  /'
