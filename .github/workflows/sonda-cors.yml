name: Sonda marco (puntual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://meteosierra.com/webcams/laguna-grande-de-gredos/ https://meteosierra.com/webcams/cinco-lagunas/ https://meteosierra.com/webcams/puerto-de-navacerrada/; do
            echo "== $u"; curl -s -D - -o /dev/null -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130" "$u" | grep -i -E "^HTTP|x-frame-options|content-security-policy|frame-ancestors"; done
