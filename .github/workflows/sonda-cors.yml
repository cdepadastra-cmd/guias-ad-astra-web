name: Sonda webcams (puntual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 1606333836 1730668465 1606333524 1456647776 1606332877 1270826003 1365240518 1705743145 1606333087 1606333063 1606333353 1360253056 1445636774 1272223531 1793896805 1260288841 1372831528 1521560234 1369739199 1584619519 1584619412; do
            t=$(curl -s -A "Mozilla/5.0" "https://webcams.windy.com/webcams/public/embed/player/$id/day" | grep -o "<title>[^<]*</title>" | head -1)
            echo "CAM $id $t"; done
