name: Sonda webcams (puntual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" https://meteosierra.com/webcams/ -o w.html
          echo "== enlaces"; grep -o 'href="https://meteosierra.com/webcams/[^"]*"' w.html | sort -u
          for s in refugio-laguna-grande sierra-de-gredos navarredonda-de-gredos guisando telegrafo puerto-de-navacerrada cinco-lagunas laguna-grande cantalojas; do
            echo "== $s"; curl -s -A "Mozilla/5.0" -o p.html -w "%{http_code}\n" "https://meteosierra.com/webcams/$s/"
            grep -o -E '(youtube\.com/embed/[^"?&]*|youtube\.com/watch\?v=[^"&]*|youtu\.be/[^"&]*|live_stream\?channel=[^"&]*|https?://[^"]*\.(jpg|jpeg|png|webp)[^"]*)' p.html | grep -v -i "logo\|icon\|wp-content/themes\|avatar\|favicon" | sort -u | head -15; done
