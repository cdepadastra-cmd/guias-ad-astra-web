name: Sonda CORS (puntual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://brouter.de/brouter?lonlats=-5.2317,40.2862|-5.2489,40.2508&profile=hiking-mountain&alternativeidx=0&format=geojson" ; do
            echo "== $u"
            curl -s -D - -H "Origin: https://www.guiasadastra.com" -A "Mozilla/5.0" "$u" | head -c 900; echo; done
