name: Sonda CORS (puntual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/10/499/388.png" \
            "https://elevation-tiles-prod.s3.amazonaws.com/terrarium/10/499/388.png" \
            "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/14/7988/6211.png" ; do
            echo "== $u"
            curl -s -o /dev/null -D - -H "Origin: https://www.guiasadastra.com" -A "Mozilla/5.0" "$u" ; done
