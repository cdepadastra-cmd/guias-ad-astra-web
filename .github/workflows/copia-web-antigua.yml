# Copia de seguridad de la web antigua (Mobirise) antes de cambiarla por la nueva.
# Descarga todos los archivos sueltos de la carpeta web (no las subcarpetas, que no se tocan)
# y los guarda en la rama "copia-web-antigua" de este repositorio. No cambia nada en el servidor.
name: Copia de la web antigua
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
      - name: Descargar archivos de la web antigua
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p /tmp/copia && cd /tmp/copia
          lftp -u "$U","$P" "$H" -e "set ssl:verify-certificate no; set net:max-retries 5; set net:timeout 60; mirror --no-recursion --verbose=1 /guiasadastra.com/ ./web/; bye"
          ls -la web | head -150; du -sh web
          test -s web/index.html
      - name: Guardar en la rama copia-web-antigua
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan copia-web-antigua; git rm -rqf --cached . ; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/copia/web/. . ; printf "Copia de la web antigua de www.guiasadastra.com hecha el %s antes de publicar la web nueva.\n" "$(date -u +%F)" > LEEME-COPIA.txt
          git add -A; git commit -qm "Copia de la web antigua (archivos de la raíz)"; git push -f origin copia-web-antigua
