name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado intermedio de SAIH Duero (su servidor no lo envía)
        run: |
          curl -sS http://cacerts.thawte.com/ThawteTLSRSACAG1.crt -o thawte.der
          openssl x509 -inform DER -in thawte.der -out thawte.pem
          cat "$(python3 -c 'import ssl;print(ssl.get_default_verify_paths().openssl_cafile)')" thawte.pem > bundle.pem
      - run: |
          python3 - <<'PY'
          import urllib.request, re, ssl, json
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/120","Accept-Language":"es-ES"}
          ctxd=ssl.create_default_context(cafile="bundle.pem")
          def get(u, ctx=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25,context=ctx); return r.status, r.geturl(), r.read().decode("utf-8","ignore")
              except Exception as e: return getattr(e,"code",0), u, "ERROR " + repr(e)[:300]
          import urllib.parse
          XH=dict(H, **{"X-Requested-With":"XMLHttpRequest"})
          def req(path, data=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request("https://saihtajo.chtajo.es/"+path, data=(urllib.parse.urlencode(data).encode() if data else None), headers=XH), timeout=30)
                  return r.read().decode("utf-8","ignore")
              except Exception as e: return "ERR "+repr(e)[:200]
          t=req("search", {"busquedatiemporeal":"Jerte"}); print("  SEARCH", re.sub(r"\s+"," ",t)[:1500])
          t=req("tiemporeal"); print("  TR", len(t), re.sub(r"\s+"," ",t)[:600])
          for k in ("Jerte","Torno"):
              for mm in list(re.finditer(k, t))[:4]: print("  TR[%s]: %s" % (k, re.sub(r"\s+"," ",t[max(0,mm.start()-300):mm.start()+300])))
          urls=re.findall(r'"url"\s*:\s*"([^"]*)"', t); print("  URLS", len(urls), urls[:8])
          PY
