name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re, time, collections
          H={"User-Agent":"guiasadastra.com (estudio de caudales)"}
          def get(u):
              try:
                  b=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=40).read()
                  try: return b.decode("utf-8")
                  except UnicodeDecodeError: return b.decode("latin-1")
              except Exception as e: return "ERROR "+repr(e)[:200]
          B="https://ceh.cedex.es/anuarioaforos/afo/"
          for est in ("2150","2512","2108"):
              idx=get(B+"estaf-datos_anual.asp?ref_ceh="+est)
              anos=sorted(set(re.findall(r"ano_hidr=(\d{4})", idx)))
              print("=====", est, len(idx), "años:", anos[-8:], re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",idx))[:300])
              meses=collections.defaultdict(list)
              for a in anos[-6:]:
                  t=get(B+"estaf-datos_dia.asp?ref_ceh=%s&ano_hidr=%s" % (est,a)); time.sleep(1)
                  for d,mo,y,rest in re.findall(r"(\d{2})/(\d{2})/(\d{4})</td>(.*?)</tr>", t, re.S):
                      nums=re.findall(r">\s*(-?\d+[.,]?\d*)\s*<", rest)
                      if len(nums)>=2:
                          q=float(nums[1].replace(",","."))
                          meses[mo].append(q)
                          if mo=="07" and d in ("25","27","29"): print("   ", y, mo, d, "q=", q)
              for mo in ("06","07","08","09"):
                  v=sorted(meses.get(mo,[]))
                  if v: print("   mes %s n=%d p10=%.2f p25=%.2f p50=%.2f p75=%.2f p90=%.2f" % (mo,len(v),v[len(v)//10],v[len(v)//4],v[len(v)//2],v[3*len(v)//4],v[9*len(v)//10]))
          PY
