name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado intermedio de SAIH Duero (su servidor no lo envía)
        run: |
          curl -sS http://cacerts.thawte.com/ThawteTLSRSACAG1.crt -o thawte.der
          openssl x509 -inform DER -in thawte.der -out thawte.pem
          cat "$(python3 -c 'import ssl;print(ssl.get_default_verify_paths().openssl_cafile)')" thawte.pem > bundle.pem
      - run: |
          python3 - <<'PY'
          import urllib.request, re, ssl, json
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/120","Accept-Language":"es-ES"}
          ctxd=ssl.create_default_context(cafile="bundle.pem")
          def get(u, ctx=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25,context=ctx); return r.status, r.geturl(), r.read().decode("utf-8","ignore")
              except Exception as e: return getattr(e,"code",0), u, "ERROR " + repr(e)[:300]
          st,fu,html=get("https://saihtajo.chtajo.es/")
          for a in sorted(set(re.findall(r'<form[^>]*>', html)))[:40]: print("  FORM", a[:250])
          for a in sorted(set(re.findall(r'(?:action|data-script|script)\s*=\s*["\']([^"\']+)["\']', html)))[:60]: print("  ACT", a)
          st,fu,js=get("https://saihtajo.chtajo.es/cache/js.js")
          for k in ("enviarFormInterna(","cargarContenido(","ver-estacion","verEstacion"):
              n=0
              for mm in re.finditer(re.escape(k), js):
                  print("  js[%s]: %s" % (k,re.sub(r"\s+"," ",js[max(0,mm.start()-120):mm.start()+260]))); n+=1
                  if n>=4: break
          st,fu,h=get("https://www.saihduero.es/datos-tiempo-real/risr", ctxd)
          print("===== duero risr", st, len(h)); print(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",h))[:800])
          for l in sorted(set(re.findall(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']',h)))[:90]: print("   ",l)
          for l in sorted(set(re.findall(r'["\']([^"\']*(?:json|ajax|api/|\.php|risr/)[^"\']*)["\']',h,re.I)))[:50]: print("  *",l)
          PY
