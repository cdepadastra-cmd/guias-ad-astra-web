name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/120","Accept-Language":"es-ES"}
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25); return r.status, r.geturl(), r.read().decode("utf-8","ignore")
              except Exception as e: return getattr(e,"code",0), u, "ERROR " + repr(e)[:300]
          st,fu,js=get("https://saihtajo.chtajo.es/cache/js.js")
          print("JS", st, len(js))
          for m in sorted(set(re.findall(r'["\'](index\.php\?[^"\']{0,120}|[^"\'\s]*\?w=[^"\']{0,120}|[^"\'\s]*(?:json|ajax)[^"\'\s]{0,80})["\']', js)))[:80]: print("  >", m)
          for k in ("w=get", "getestacion", "datos-tiempo-real", "exportarjson", "url10dias"):
              for mm in re.finditer(re.escape(k), js):
                  print("  ctx[%s]:" % k, js[max(0,mm.start()-160):mm.start()+200].replace("\n"," "))
                  break
          for u in ["http://www.saihduero.es/", "https://www.saihduero.es/", "https://saihduero.es/", "http://saihduero.es/risr/"]:
              st,fu,h=get(u); print("=====",u,st,fu,len(h)); print(h[:300] if h.startswith("ERROR") else re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",h))[:400])
              for l in sorted(set(re.findall(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']',h)))[:60]: print("   ",l)
          PY
