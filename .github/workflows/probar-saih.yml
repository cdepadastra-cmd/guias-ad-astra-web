name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado intermedio de SAIH Duero
        run: |
          curl -sS --fail http://cacerts.thawte.com/ThawteTLSRSACAG1.crt -o thawte.der
          openssl x509 -inform DER -in thawte.der -out thawte.pem
          cat "$(python3 -c 'import ssl;print(ssl.get_default_verify_paths().openssl_cafile)')" thawte.pem > bundle.pem
      - run: |
          python3 - <<'PY'
          import urllib.request, re, ssl, http.cookiejar
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile="bundle.pem")), urllib.request.HTTPCookieProcessor(cj))
          op.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) Chrome/120"),("Accept-Language","es-ES")]
          import collections
          for est in ("EA512","EA150"):
              h=op.open("https://www.saihduero.es/risr/"+est,timeout=30).read().decode("utf-8","ignore")
              for l in sorted(set(re.findall(r'risr/%s/historico/[A-Za-z0-9]+' % est, h))):
                  t=op.open("https://www.saihduero.es/"+l,timeout=60).read().decode("utf-8","ignore")
                  k=t.find("<table"); cab=re.sub(r"<[^>]+>|\s+"," ",t[k:k+800]) if k>0 else ""
                  filas=re.findall(r"(\d{2})/(\d{2})/(\d{4}) (\d{2}):\d{2}\s*</td>\s*<td[^>]*>\s*([-\d.,]+)", t)
                  print("=====", est, l[-16:], "cabecera:", cab[:200], "filas:", len(filas), filas[:2])
                  por=collections.defaultdict(list)
                  for d,mo,y,hh,v in filas:
                      try: q=float(v.replace(".","").replace(",",".")) if "," in v else float(v)
                      except ValueError: continue
                      clave = "%s-%s" % (y,mo) if not (mo=="08" and int(d)>=16) else "2026-08b"
                      por[clave].append(q)
                  for kk in sorted(por):
                      v=sorted(por[kk]); print("    %s n=%d p10=%.2f p50=%.2f p90=%.2f min=%.2f max=%.2f" % (kk,len(v),v[len(v)//10],v[len(v)//2],v[9*len(v)//10],v[0],v[-1]))
          PY
