name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado intermedio de SAIH Duero (su servidor no lo envía)
        run: |
          curl -sS http://cacerts.thawte.com/ThawteTLSRSACAG1.crt -o thawte.der
          openssl x509 -inform DER -in thawte.der -out thawte.pem
          cat "$(python3 -c 'import ssl;print(ssl.get_default_verify_paths().openssl_cafile)')" thawte.pem > bundle.pem
      - run: |
          python3 - <<'PY'
          import urllib.request, re, ssl, json
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/120","Accept-Language":"es-ES"}
          ctxd=ssl.create_default_context(cafile="bundle.pem")
          def get(u, ctx=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25,context=ctx); return r.status, r.geturl(), r.read().decode("utf-8","ignore")
              except Exception as e: return getattr(e,"code",0), u, "ERROR " + repr(e)[:300]
          st,fu,html=get("https://saihtajo.chtajo.es/")
          for cls in ("tiemporeal-buscador","home-buscador","aforosenrio-buscador"):
              k=html.find(cls); print("  FORMHTML[%s]:" % cls, re.sub(r"\s+"," ",html[max(0,k-400):k+900]))
          for k in ("default_url","urlmenu","default_template"):
              m=re.search(r'id="%s"[^>]*value="([^"]*)"' % k, html) or re.search(r'value="([^"]*)"[^>]*id="%s"' % k, html); print("  INPUT", k, m.group(1) if m else None)
          import urllib.parse
          for path, data in (("search", {"q":"Jerte"}), ("search", {"buscar":"Jerte"}), ("search", {"search":"Jerte"})):
              try:
                  r=urllib.request.urlopen(urllib.request.Request("https://saihtajo.chtajo.es/"+path, data=urllib.parse.urlencode(data).encode(), headers=dict(H, **{"X-Requested-With":"XMLHttpRequest","Content-Type":"application/x-www-form-urlencoded"})), timeout=25)
                  print("  POST", path, data, r.status, r.read().decode("utf-8","ignore")[:700])
              except Exception as e: print("  POST", path, data, "ERR", repr(e)[:200])
          PY
