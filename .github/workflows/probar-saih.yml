name: Probar SAIH (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado intermedio de SAIH Duero
        run: |
          curl -sS --fail http://cacerts.thawte.com/ThawteTLSRSACAG1.crt -o thawte.der
          openssl x509 -inform DER -in thawte.der -out thawte.pem
          cat "$(python3 -c 'import ssl;print(ssl.get_default_verify_paths().openssl_cafile)')" thawte.pem > bundle.pem
      - run: |
          python3 - <<'PY'
          import urllib.request, re, ssl, http.cookiejar
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile="bundle.pem")), urllib.request.HTTPCookieProcessor(cj))
          op.addheaders=[("User-Agent","Mozilla/5.0 (X11; Linux x86_64) Chrome/120"),("Accept-Language","es-ES")]
          h=op.open("https://www.saihduero.es/risr/EA512",timeout=30).read().decode("utf-8","ignore")
          k=h.find("Datos históricos"); print("BLOQUE:", re.sub(r"\s+"," ",h[k-200:k+2500]))
          links=sorted(set(re.findall(r'risr/EA512/historico/[A-Za-z0-9]+', h)))
          for l in links:
              r=op.open("https://www.saihduero.es/"+l,timeout=60); b=r.read()
              print("=====", l, r.status, r.headers.get("Content-Type"), r.headers.get("Content-Disposition"), len(b))
              t=b.decode("utf-8","ignore")
              if "<html" in t[:200].lower():
                  i=t.lower().find("<body"); print("   BODY:", re.sub(r"\s+"," ",t[i:i+1500]))
              else:
                  print("   ", t[:400].replace("\n"," | "))
                  lin=[x for x in t.splitlines() if re.search(r"(2[05]|27)/07/20\d\d|20\d\d-07-2[57]", x)]
                  print("   JULIO:", lin[:12])
          PY
