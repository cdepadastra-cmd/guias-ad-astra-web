# Sube automáticamente la web a www.guiasadastra.com cada vez que hay un cambio en "main".
# Solo sube y actualiza sus propios archivos: no toca las demás carpetas del servidor (otras webs, assets antiguos, etc.).
# Los datos FTP se guardan en GitHub > Settings > Secrets and variables > Actions (nadie más los ve):
#   FTP_SERVER   p. ej. ftp.guiasadastra.com
#   FTP_USER     usuario FTP
#   FTP_PASSWORD contraseña FTP
name: Subir la web a guiasadastra.com

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # cada hora: mira si han cambiado los precios en la hoja de Google

concurrency:
  group: ftp-web
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Avisar si faltan los datos FTP
        if: env.FTP_SERVER == ''
        run: echo "::warning::Faltan los datos FTP en Settings > Secrets and variables > Actions. No se sube nada."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - uses: actions/setup-python@v5
        if: env.FTP_SERVER != ''
        with:
          python-version: "3.12"

      # Descarga la hoja «Precios web Guías Ad Astra». En las pasadas de cada hora, si la hoja no ha
      # cambiado desde la última publicación (o no responde), no se hace nada más.
      - name: Leer la hoja de precios
        id: hoja
        if: env.FTP_SERVER != ''
        run: |
          python3 - <<'PY'
          import hashlib, os, urllib.request, precios
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          try:
              req = urllib.request.Request(precios._url(), headers={"User-Agent": "guiasadastra-build"})
              raw = urllib.request.urlopen(req, timeout=30).read()
              if raw.lstrip().startswith(b"<"):
                  raise RuntimeError("la hoja no está compartida como «Cualquier persona con el enlace: lector»")
              open("precios-hoja.csv", "wb").write(raw)
              out.write("ok=true\nhash=%s\n" % hashlib.sha1(raw).hexdigest()[:16])
              print("Hoja de precios leída")
          except Exception as ex:
              print("::warning::No he podido leer la hoja de precios: %s" % ex)
              out.write("ok=false\nhash=sin-hoja\n")
          PY

      - name: ¿Ya está publicada esta versión de los precios?
        id: cache
        if: env.FTP_SERVER != '' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: precios-hoja.csv
          key: precios-${{ steps.hoja.outputs.hash }}-${{ github.sha }}
          lookup-only: true

      - name: Decidir si hay que publicar
        id: seguir
        if: env.FTP_SERVER != ''
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ steps.hoja.outputs.ok }}" != "true" ] || [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; }; then
            echo "Sin cambios de precios: no se publica nada."; echo "si=false" >> "$GITHUB_OUTPUT"
          else
            echo "si=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar la web
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true'
        env:
          PRECIOS_CSV: ${{ steps.hoja.outputs.ok == 'true' && 'precios-hoja.csv' || '' }}
          PRECIOS_OFF: ${{ steps.hoja.outputs.ok == 'true' && '' || '1' }}
        run: python3 build.py

      - name: Subir por FTP
        id: ftp1
        continue-on-error: true
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Carpeta de la web guiasadastra.com en el servidor (Plesk)
          server-dir: /guiasadastra.com/
          timeout: 120000

      - name: Esperar unos segundos
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true' && steps.ftp1.outcome == 'failure'
        run: sleep 20

      - name: Reintentar si se cortó la conexión
        id: ftp2
        continue-on-error: true
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true' && steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Carpeta de la web guiasadastra.com en el servidor (Plesk)
          server-dir: /guiasadastra.com/
          timeout: 120000

      - name: Avisar si no se pudo subir
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true' && steps.ftp1.outcome == 'failure' && steps.ftp2.outcome != 'success'
        run: |
          echo "::error::No se pudo subir la web por FTP (dos intentos)."
          exit 1

      - name: Recordar que esta versión de los precios ya está publicada
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true' && steps.hoja.outputs.ok == 'true' && (steps.ftp1.outcome == 'success' || steps.ftp2.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: precios-hoja.csv
          key: precios-${{ steps.hoja.outputs.hash }}-${{ github.sha }}

      - name: Avisar a Bing y otros buscadores (IndexNow)
        if: env.FTP_SERVER != '' && steps.seguir.outputs.si == 'true'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          key = "697f1ec93b9c9b8b29191ad035f6dd36"
          urls = re.findall(r"<loc>([^<]+)</loc>", open("dist/sitemap.xml", encoding="utf-8").read())
          body = json.dumps({"host": "www.guiasadastra.com", "key": key, "keyLocation": "https://www.guiasadastra.com/%s.txt" % key, "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "direcciones")
          except Exception as e:
              print("IndexNow no respondió:", e)
          PY
