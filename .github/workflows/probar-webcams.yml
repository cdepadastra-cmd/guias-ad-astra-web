name: Probar webcams (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Webcams
        run: |
          python3 - <<'PY'
          import urllib.request, re
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36","Accept-Language":"es-ES,es"}
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25); return r.status, r.read().decode("utf-8","ignore")
              except Exception as e: return getattr(e,"code",0), ""
          slugs="la_covatilla_estacion_de_esqui bejar puerto_de_navacerrada isaba belagua molina_de_aragon cervera_de_pisuerga pajares babia_hora torla benasque arties aviados acebedo teruel salamanca la_tejera alto_del_pen sierra_d_abodi arangoiti izaga".split()
          vistos=set()
          for sl in slugs:
              st,h=get("https://www.windfinder.com/webcams/"+sl)
              ids=sorted(set(re.findall(r"windy\.com/webcams/(?:public/embed/player/)?(\d{10})",h)) | set(re.findall(r"/(\d{10})/(?:current|daylight|preview|thumbnail|full)",h)) | set(re.findall(r"images-webcams\.windy\.com/\d+/(\d{10})",h)))
              tit=re.findall(r'(?:alt|title)="([^"]{4,90})"',h)
              print("##",sl,st,len(h),ids[:15], [t for t in tit if "ebcam" in t or "Webcam" in t][:8])
              vistos.update(ids)
          for i in sorted(vistos | set("1457592434 1793902076 1705743145 1519730803".split())):
              st,h=get("https://webcams.windy.com/webcams/public/embed/player/%s/day"%i)
              t=re.search(r"<title>(.*?)</title>",h,re.S)
              print(i, st, t.group(1).strip()[:110] if t else "")
          PY
