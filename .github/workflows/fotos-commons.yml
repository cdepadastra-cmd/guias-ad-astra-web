# Busca o descarga fotos con licencia libre de Wikimedia Commons para los artículos (puntual).
# Deja el resultado en la rama "fotos-tmp" (no toca main).
name: Fotos de Wikimedia Commons (puntual)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "buscar o bajar"
        default: "buscar"
      lista:
        description: "Archivo JSON"
        default: "tools/fotos/busquedas.json"
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - timeout-minutes: 50
        run: |
          case "${{ inputs.modo }}" in
            sonda) python tools/sonda.py sonda ${{ inputs.lista }} ;;
            blog-*) python tools/blog_fotos.py "${{ inputs.modo }}" ${{ inputs.lista }} ;;
            *) python tools/fotos_commons.py ${{ inputs.modo }} ${{ inputs.lista }} ;;
          esac
      - if: always()
        run: |
          mkdir /tmp/r && cp -r salida /tmp/r/ && cd /tmp/r
          git init -q -b fotos-tmp && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "fotos ${{ inputs.modo }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fotos-tmp
