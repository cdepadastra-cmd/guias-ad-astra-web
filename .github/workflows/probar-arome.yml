name: Probar AROME (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet eccodes numpy && python -m eccodes selfcheck
      - name: Inventario
        run: |
          python - <<'PY'
          import urllib.request, datetime as dt, time, eccodes, io, collections
          B="https://meteofrance-pnt.s3.rbx.io.cloud.ovh.net/pnt"
          now=dt.datetime.utcnow()
          for back in range(0,24,3):
              r=(now-dt.timedelta(hours=back)).replace(minute=0,second=0,microsecond=0)
              r=r.replace(hour=r.hour-r.hour%3); d=r.strftime("%Y-%m-%dT%H")
              u=f"{B}/{d}:00:00Z/arome/0025/SP1/arome__0025__SP1__00H06H__{d}:00:00Z.grib2"
              try:
                  urllib.request.urlopen(urllib.request.Request(u,method="HEAD"),timeout=20); break
              except Exception as e: print("no",d,e)
          print("RUN",d)
          for pq in ("SP1","SP2","SP3","HP1","IP1"):
              u=f"{B}/{d}:00:00Z/arome/0025/{pq}/arome__0025__{pq}__07H12H__{d}:00:00Z.grib2"
              t=time.time()
              try: data=urllib.request.urlopen(u,timeout=120).read()
              except Exception as e: print(pq,"ERR",e); continue
              print(f"== {pq}: {len(data)/1e6:.1f} MB en {time.time()-t:.1f}s")
              c=collections.Counter(); f=io.BytesIO(data)
              import tempfile,os
              p=tempfile.mktemp(); open(p,"wb").write(data)
              with open(p,"rb") as fh:
                  while True:
                      h=eccodes.codes_grib_new_from_file(fh)
                      if h is None: break
                      k=(eccodes.codes_get(h,"shortName"),eccodes.codes_get(h,"typeOfLevel"),eccodes.codes_get(h,"level"),eccodes.codes_get(h,"stepRange"))
                      c[k[:3]]+=1
                      if pq=="SP1" and c[k[:3]]==1: print("  ",k, eccodes.codes_get(h,"Ni"),eccodes.codes_get(h,"Nj"))
                      eccodes.codes_release(h)
              print(sorted(c.items()))
          PY
