# Previsión meteorológica de montaña (página /meteo/ de la web).
# Cada 6 horas descarga ECMWF IFS, NOAA GFS y DWD ICON-EU, calcula la previsión de cada macizo
# (meteo/procesar.py) y sube los JSON a /meteo/datos/ por FTP. No toca el resto de la web.
name: Previsión meteorológica de montaña

on:
  schedule:
    # UTC: cuando ya están publicadas las pasadas de 00, 06, 12 y 18. GitHub se salta a menudo ejecuciones
    # programadas, así que hay tres intentos por pasada; si la previsión publicada ya es reciente, no se hace nada.
    - cron: "40 3-5,9-11,15-17,21-23 * * *"
  workflow_dispatch:

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      hacer: ${{ steps.c.outputs.hacer }}
    steps:
      - id: c
        name: ¿Hace falta una previsión nueva?
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "hacer=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request, datetime as dt
          try:
              d = json.load(urllib.request.urlopen("https://www.guiasadastra.com/meteo/datos/resumen.json?n=%d" % dt.datetime.utcnow().timestamp(), timeout=20))
              g = dt.datetime.strptime(d["generado"], "%Y-%m-%dT%H:%MZ")
              edad = (dt.datetime.utcnow() - g).total_seconds() / 3600
          except Exception as ex:
              edad = 99
          print("hacer=%d" % (edad >= 4.5))
          PY

  meteo:
    needs: comprobar
    if: needs.comprobar.outputs.hacer == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías (ecCodes para leer GRIB)
        run: pip install --quiet eccodes ecmwf-opendata numpy requests && python -m eccodes selfcheck

      # ECMWF solo publica pasadas nuevas a las 00 y 12 UTC: si ya se procesó, se reutiliza (menos minutos de GitHub)
      - name: Recuperar caché de ECMWF
        uses: actions/cache/restore@v4
        with:
          path: meteo-cache
          key: meteo-cache-${{ github.run_id }}
          restore-keys: meteo-cache-

      - name: Descargar modelos y calcular la previsión
        run: python3 meteo/procesar.py --out meteo-out

      - name: Guardar caché de ECMWF
        if: always()
        uses: actions/cache/save@v4
        with:
          path: meteo-cache
          key: meteo-cache-${{ github.run_id }}

      - name: Subir datos por FTP
        id: ftp1
        continue-on-error: true
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./meteo-out/
          server-dir: /guiasadastra.com/meteo/datos/
          timeout: 120000

      - name: Reintentar si se cortó la conexión
        id: ftp2
        if: env.FTP_SERVER != '' && steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./meteo-out/
          server-dir: /guiasadastra.com/meteo/datos/
          timeout: 120000
