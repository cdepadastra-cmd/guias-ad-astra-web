# Copia las fotos que estaban alojadas en Lovable dentro de la web (static/media/),
# para que la web no dependa de Lovable. Se lanza a mano (Actions > Descargar fotos > Run workflow)
# o al cambiar la lista static/media-lista.txt.
name: Descargar fotos de Lovable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [static/media-lista.txt]

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          set -e
          fallos=0
          while read -r p; do
            [ -z "$p" ] && continue
            dest="static/media/$p"
            [ -s "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            if ! curl -fsSL --retry 3 -o "$dest" "https://ad-astra-adventures.lovable.app/__l5e/assets-v1/$p"; then
              echo "::error::No se pudo descargar $p"; rm -f "$dest"; fallos=$((fallos+1))
            fi
          done < static/media-lista.txt
          ls -R static/media | head -80
          du -sh static/media
          [ "$fallos" -eq 0 ]
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add static/media
          git diff --cached --quiet || git commit -m "Fotos copiadas desde Lovable a static/media"
          git push
