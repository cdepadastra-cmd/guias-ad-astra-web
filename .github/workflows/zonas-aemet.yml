name: Zonas de aviso de AEMET (puntual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  zonas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshp pyproj
      - run: python tools/zonas_aemet.py
      - uses: actions/upload-artifact@v4
        with:
          name: zonas-aemet
          path: zonas-aemet.json
