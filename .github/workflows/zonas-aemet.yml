name: Zonas de aviso de AEMET (puntual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  zonas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshp pyproj
      - run: python tools/zonas_aemet.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meteo/zonas-aemet.json
          git diff --cached --quiet || (git commit -m "Zonas de aviso de AEMET (delimitación oficial, simplificada)" && git push)
