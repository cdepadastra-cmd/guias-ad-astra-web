xt x="460" y="54" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#f3e9df">El Torozo · Gran Diedro</text><text x="460" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#b9a593">≈ 200 m · 6 largos · V+ máx. · cara sur</text><rect x="460" y="129" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="146" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="146" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L1 </text><rect x="460" y="167" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="184" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="184" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L2 </text><rect x="460" y="205" width="54" height="24" rx="6" fill="#e6c32e"/><text x="487" y="222" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V</text><text x="524" y="222" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L3 </text><rect x="460" y="243" width="54" height="24" rx="6" fill="#e6c32e"/><text x="487" y="260" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V</text><text x="524" y="260" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L4 </text><rect x="460" y="281" width="54" height="24" rx="6" fill="#f08a24"/><text x="487" y="298" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V+</text><text x="524" y="298" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L5 </text><text x="524" y="318" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">El largo más difícil del diedro.</text><rect x="460" y="335" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="352" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="352" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L6 </text><text x="524" y="372" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Salida hacia la cumbre.</text><text x="24" y="662" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8a7d6e">Croquis esquemático y orientativo de Guías Ad Astra. No sustituye a una reseña actualizada.</text></svg>