<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-label="Croquis esquemático de Pequeño Galayo · Sur de la Apretura"><defs><linearGradient id="gpequeno-galayo-apretura" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d8378"/><stop offset="1" stop-color="#5d554d"/></linearGradient></defs><rect width="900" height="680" rx="18" fill="#1b120c"/><path d="M80 620 L110 450 L140 330 L190 230 L240 170 L280 160 L320 200 L360 330 L400 620Z" fill="url(#gpequeno-galayo-apretura)" stroke="#a89c8e" stroke-width="2"/><g stroke="#4a433c" stroke-width="2" fill="none" opacity=".6"><path d="M180 600 l20 -120 l-10 -80"/><path d="M330 590 l-14 -150 l10 -60"/></g><path d="M200 610 L186 500" stroke="#4caf50" stroke-width="5" stroke-linecap="round"/><path d="M186 500 L232 400" stroke="#4caf50" stroke-width="5" stroke-linecap="round"/><path d="M232 400 L214 290" stroke="#4caf50" stroke-width="5" stroke-linecap="round"/><path d="M214 290 L280 172" stroke="#f08a24" stroke-width="5" stroke-linecap="round"/><path d="M200 610" /><text x="200" y="630" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#f3e9df" text-anchor="middle">Inicio</text><circle cx="186" cy="500" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="200" y="504" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R1</text><circle cx="232" cy="400" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="246" y="404" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R2</text><circle cx="214" cy="290" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="228" y="294" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R3</text><text x="179" y="559" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L1 IV</text><text x="195" y="454" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L2 IV</text><text x="209" y="349" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L3 IV</text><text x="233" y="235" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L4 V+</text><text x="280" y="146" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#e9a53b" text-anchor="middle">Cima del Pequeño Galayo</text><path d="M300 200 Q430 200 420 330" stroke="#4fb3e8" stroke-width="3" stroke-dasharray="8 6" fill="none"/><path d="M420 336 l-6 -10 h12z" fill="#4fb3e8"/><text x="24" y="636" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4fb3e8">↘ Bajada: rápel al hombro y destrepe por hitos hacia la canal</text><text x="460" y="54" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#f3e9df">Pequeño Galayo</text><text x="460" y="80" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#e9a53b">Sur de la Apretura</text><text x="460" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#b9a593">≈ 120–150 m · IV/IV+ con un paso de V+ (evitable)</text><rect x="460" y="129" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="146" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="146" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L1 </text><text x="524" y="166" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Diedrito vertical en la pared izquierda de la</text><text x="524" y="182" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">canal del Gran Galayo; reunión en una gran</text><text x="524" y="198" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">terraza.</text><rect x="460" y="215" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="232" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="232" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L2 </text><text x="524" y="252" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Pared vertical de buenos cantos hacia la</text><text x="524" y="268" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">derecha; reunión en un nicho con clavo.</text><rect x="460" y="285" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="302" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="302" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L3 </text><text x="524" y="322" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Travesía a la izquierda, chimenea corta,</text><text x="524" y="338" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">placa y canal-chimenea hasta una gran repisa.</text><rect x="460" y="355" width="54" height="24" rx="6" fill="#f08a24"/><text x="487" y="372" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V+</text><text x="524" y="372" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L4 </text><text x="524" y="392" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Hombro amplio y fisura de V+ (se puede</text><text x="524" y="408" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">evitar), diedro tumbado hasta el collado.</text><text x="24" y="662" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8a7d6e">Croquis esquemático y orientativo de Guías Ad Astra. No sustituye a una reseña actualizada.</text></svg>