<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-label="Croquis esquemático de Tres Hermanitos (Circo de Gredos)"><defs><linearGradient id="ghermanitos" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d8378"/><stop offset="1" stop-color="#5d554d"/></linearGradient></defs><rect width="900" height="680" rx="18" fill="#1b120c"/><path d="M40 620 L70 360 L100 250 L135 240 L160 330 L190 360 L215 230 L250 220 L280 330 L310 380 L340 300 L372 290 L400 400 L430 620Z" fill="url(#ghermanitos)" stroke="#a89c8e" stroke-width="2"/><g stroke="#4a433c" stroke-width="2" fill="none" opacity=".6"><path d="M180 600 l20 -120 l-10 -80"/><path d="M330 590 l-14 -150 l10 -60"/></g><path d="M108 600 Q88 420 118 250" stroke="#f08a24" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="118" cy="246" r="7" fill="#f3e9df"/><text x="118" y="228" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle" paint-order="stroke" stroke="#1b120c" stroke-width="4">1.º · V+</text><path d="M222 600 Q202 411 232 232" stroke="#f08a24" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="232" cy="228" r="7" fill="#f3e9df"/><text x="232" y="210" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle" paint-order="stroke" stroke="#1b120c" stroke-width="4">2.º · V+</text><path d="M346 600 Q326 446 356 302" stroke="#4caf50" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="356" cy="298" r="7" fill="#f3e9df"/><text x="356" y="280" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle" paint-order="stroke" stroke="#1b120c" stroke-width="4">3.º · IV</text><text x="460" y="54" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#f3e9df">Tres Hermanitos (Circo de Gredos)</text><text x="460" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#b9a593">≈ 2.280 m · tres agujas · vías de 1–2 largos</text><rect x="460" y="129" width="54" height="24" rx="6" fill="#f08a24"/><text x="487" y="146" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V+</text><text x="524" y="146" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">1.º ≈ 50 m · 2 L</text><text x="524" y="166" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Vía Pirineos (cara SO). Fisura hasta un</text><text x="524" y="182" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">rellano y travesía bajo el gran diedro.</text><rect x="460" y="199" width="54" height="24" rx="6" fill="#f08a24"/><text x="487" y="216" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V+</text><text x="524" y="216" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">2.º ≈ 45 m · 2 L</text><text x="524" y="236" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Vía Teógenes (cara SO). Primer largo de</text><text x="524" y="252" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">buscar la línea, segundo corto y desplomado.</text><rect x="460" y="269" width="54" height="24" rx="6" fill="#4caf50"/><text x="487" y="286" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">IV</text><text x="524" y="286" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">3.º ≈ 30 m · 1 L</text><text x="524" y="306" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Vía Teógenes (cara N). Fisura con un</text><text x="524" y="322" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">estrechamiento protegido con clavos.</text><text x="24" y="662" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8a7d6e">Croquis esquemático y orientativo de Guías Ad Astra. No sustituye a una reseña actualizada.</text></svg>