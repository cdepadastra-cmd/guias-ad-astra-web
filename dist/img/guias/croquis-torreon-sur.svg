<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-label="Croquis esquemático de Torreón de los Galayos · Sur Clásica"><defs><linearGradient id="gtorreon-sur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d8378"/><stop offset="1" stop-color="#5d554d"/></linearGradient></defs><rect width="900" height="680" rx="18" fill="#1b120c"/><path d="M120 620 L150 300 L190 170 L230 110 L262 96 L300 120 L330 190 L360 330 L392 620Z" fill="url(#gtorreon-sur)" stroke="#a89c8e" stroke-width="2"/><g stroke="#4a433c" stroke-width="2" fill="none" opacity=".6"><path d="M180 600 l20 -120 l-10 -80"/><path d="M330 590 l-14 -150 l10 -60"/></g><path d="M232 600 L246 420" stroke="#e6c32e" stroke-width="5" stroke-linecap="round"/><path d="M246 420 L222 300" stroke="#f08a24" stroke-width="5" stroke-linecap="round"/><path d="M222 300 L262 110" stroke="#e6c32e" stroke-width="5" stroke-linecap="round"/><path d="M232 600" /><text x="232" y="620" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#f3e9df" text-anchor="middle">Inicio</text><circle cx="246" cy="420" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="260" y="424" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R1</text><circle cx="222" cy="300" r="9" fill="#1b120c" stroke="#f3e9df" stroke-width="3"/><text x="236" y="304" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#f3e9df">R2</text><text x="225" y="514" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L1 V</text><text x="220" y="364" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L2 V+</text><text x="228" y="209" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="end" paint-order="stroke" stroke="#1b120c" stroke-width="4">L3 V</text><text x="262" y="82" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#e9a53b" text-anchor="middle">Cima (≈ 2.120 m)</text><path d="M300 120 Q430 120 420 300" stroke="#4fb3e8" stroke-width="3" stroke-dasharray="8 6" fill="none"/><path d="M420 306 l-6 -10 h12z" fill="#4fb3e8"/><text x="24" y="636" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4fb3e8">↘ Acceso y bajada: rápel de 60 m por la cara norte hasta la Plataforma de las Flores</text><text x="460" y="54" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#f3e9df">Torreón de los Galayos</text><text x="460" y="80" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#e9a53b">Sur Clásica</text><text x="460" y="106" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#b9a593">≈ 130–140 m · V / V+ · granito · cara sur</text><rect x="460" y="129" width="54" height="24" rx="6" fill="#e6c32e"/><text x="487" y="146" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V</text><text x="524" y="146" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L1 ≈ 50 m</text><text x="524" y="166" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Entrada dura junto a un clavo; reunión en un</text><text x="524" y="182" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">nicho bajo un pequeño techo.</text><rect x="460" y="199" width="54" height="24" rx="6" fill="#f08a24"/><text x="487" y="216" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V+</text><text x="524" y="216" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L2 ≈ 30 m</text><text x="524" y="236" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Travesía corta a la izquierda y fisura</text><text x="524" y="252" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">vertical que lleva a un sistema de diedros.</text><rect x="460" y="269" width="54" height="24" rx="6" fill="#e6c32e"/><text x="487" y="286" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="900" fill="#1b120c" text-anchor="middle">V</text><text x="524" y="286" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#f3e9df">L3 ≈ 50 m</text><text x="524" y="306" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">Más vertical, buena roca; termina en placa</text><text x="524" y="322" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cbbcab">tumbada hasta la cadena de la cima.</text><text x="24" y="662" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#8a7d6e">Croquis esquemático y orientativo de Guías Ad Astra. No sustituye a una reseña actualizada.</text></svg>