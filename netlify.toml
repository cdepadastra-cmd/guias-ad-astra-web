# Netlify publica directamente la carpeta dist (ya generada).
# Si cambias data.py, ejecuta "python3 build.py" y sube los cambios.
[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
